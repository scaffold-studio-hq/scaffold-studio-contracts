    url: https://github.com/scaffold-studio-hq/scaffold-studio-contracts/security/advisories/new
    about: Report a security vulnerability privately instead of opening a public issue.
  - name: Question or discussion
    url: https://github.com/scaffold-studio-hq/scaffold-studio-contracts/issues
    about: Ask a question or start a discussion with the maintainers.
