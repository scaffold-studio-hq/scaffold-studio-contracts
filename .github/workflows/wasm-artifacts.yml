name: Verify production WASM artifacts

on:
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "setup-local.sh"
      - "setup-testnet.sh"
      - ".github/workflows/wasm-artifacts.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "setup-local.sh"
      - "setup-testnet.sh"
      - ".github/workflows/wasm-artifacts.yml"

permissions:
  contents: read

jobs:
  verify-wasm-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the production Soroban WASM target
        run: rustup target add wasm32v1-none
      - name: Build contract WASM artifacts from the locked workspace
        run: cargo build --workspace --release --locked --target wasm32v1-none
      - name: Verify every WASM used by the deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=()
          for script in setup-local.sh setup-testnet.sh; do
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              if [[ "$line" =~ target/wasm32v1-none/release/([[:alnum:]_-]+\.wasm) ]]; then
                expected["${BASH_REMATCH[1]}"]=1
              fi
            done < "$script"
          done
          if (( ${#expected[@]} == 0 )); then
            echo "::error::No active WASM deployment references found"
            exit 1
          fi
          failures=0
          for filename in "${!expected[@]}"; do
            path="target/wasm32v1-none/release/$filename"
            if [[ ! -s "$path" ]]; then
              echo "::error::Missing or empty expected WASM: $path"
              failures=1
            else
              echo "Verified: $path"
            fi
          done
          exit "$failures"
