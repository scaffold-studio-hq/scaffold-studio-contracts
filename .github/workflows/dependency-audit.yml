name: Audit production dependencies
on:
  pull_request:
    paths:
    - Cargo.toml
    - Cargo.lock
    - contracts/**/Cargo.toml
    - package.json
    - package-lock.json
    - packages/**/package.json
    - .github/workflows/dependency-audit.yml
  push:
    branches:
    - main
    paths:
    - Cargo.toml
    - Cargo.lock
    - contracts/**/Cargo.toml
    - package.json
    - package-lock.json
    - packages/**/package.json
    - .github/workflows/dependency-audit.yml
permissions:
  contents: read
jobs:
  npm-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Use Node 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22
    - name: Fail on high or critical production npm advisories
      run: npm audit --omit=dev --audit-level=high
  rustsec-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install pinned RustSec cargo-audit
      run: cargo install cargo-audit --version 0.22.2 --locked
    - name: Fail on RustSec advisories affecting Cargo.lock
      run: cargo audit
